<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>City Bus Driver</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}
#game{position:relative;width:100vw;height:100vh;max-width:520px;margin:auto;background:#65b84a;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;z-index:3}
.badge{background:#000b;padding:8px 11px;border-radius:10px;font-weight:bold;font-size:14px}
.controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:18px;z-index:4}
button{border:0;border-radius:18px;background:#000b;color:#fff;font-size:28px;width:76px;height:62px;font-weight:bold}
#start{position:absolute;inset:0;z-index:5;background:#000b;display:flex;align-items:center;justify-content:center;text-align:center}
.panel{background:#151515;padding:25px;border-radius:20px;width:86%;box-shadow:0 8px 30px #000}
.panel h1{margin-top:0}.panel p{color:#ddd;line-height:1.5}
.startbtn{background:#18a558;width:auto;padding:0 28px;font-size:18px}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div class="hud">
  <div class="badge">🪙 <span id="coins">0</span></div>
  <div class="badge">🏁 Level <span id="level">1</span></div>
  <div class="badge">❤️ <span id="lives">3</span></div>
</div>
<div class="controls">
  <button id="left">◀</button><button id="brake">■</button><button id="right">▶</button>
</div>
<div id="start"><div class="panel">
<h1>🚌 City Bus Driver</h1>
<p>Drive the bus, collect coins and avoid traffic!</p>
<button class="startbtn" id="startBtn">START GAME</button>
</div></div>
</div>
<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor("#111111"); tg.setBackgroundColor("#111111"); } catch(e) {}
}
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=360,H=640; canvas.width=W;canvas.height=H;
let running=false,keys={},coins=0,lives=3,level=1,score=0,last=0,spawn=0;
const bus={x:W/2,y:H-125,w:54,h:92,speed:4};
let cars=[];
function reset(){
 coins=0;lives=3;level=1;score=0;spawn=0;cars=[];
 bus.x=W/2; running=true; document.getElementById('start').style.display='none'; updateHud();
}
function updateHud(){
 document.getElementById('coins').textContent=coins;
 document.getElementById('level').textContent=level;
 document.getElementById('lives').textContent=lives;
}
function roadX(){return 55}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#66b94b';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#555';ctx.fillRect(48,0,264,H);
 ctx.fillStyle='#333';ctx.fillRect(57,0,246,H);
 ctx.fillStyle='#ddd';
 for(let y=-40;y<H;y+=75){let yy=(y+(score*2)%75);ctx.fillRect(176,yy,8,38);}
 ctx.fillStyle='#777';ctx.fillRect(48,0,8,H);ctx.fillRect(306,0,8,H);
 // roadside trees
 for(let y=20;y<H;y+=95){
   let yy=(y+(score*1.3)%95);
   ctx.fillStyle='#5b3b20';ctx.fillRect(25,yy+20,7,25);
   ctx.fillStyle='#187a2b';ctx.beginPath();ctx.arc(29,yy+16,18,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#5b3b20';ctx.fillRect(328,yy+20,7,25);
   ctx.fillStyle='#187a2b';ctx.beginPath();ctx.arc(331,yy+16,18,0,Math.PI*2);ctx.fill();
 }
 drawBus(bus.x,bus.y,bus.w,bus.h);
 cars.forEach(c=>drawCar(c.x,c.y,c.w,c.h,c.color));
}
function drawBus(x,y,w,h){
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle='#e8b923';roundRect(-w/2,-h/2,w,h,10);ctx.fill();
 ctx.fillStyle='#d71920';roundRect(-w/2,-h/2,w,18,10);ctx.fill();
 ctx.fillStyle='#bfe7ff';roundRect(-w/2+7,-h/2+25,w-14,22,5);ctx.fill();
 ctx.fillStyle='#bfe7ff';roundRect(-w/2+7,-h/2+53,w-14,20,5);ctx.fill();
 ctx.fillStyle='#111';ctx.fillRect(-w/2-5,-h/2+18,5,18);ctx.fillRect(w/2,-h/2+18,5,18);
 ctx.fillStyle='#fff';ctx.fillRect(-w/2+7,h/2-12,w-14,6);
 ctx.restore();
}
function drawCar(x,y,w,h,color){
 ctx.save();ctx.translate(x,y);ctx.fillStyle=color;roundRect(-w/2,-h/2,w,h,8);ctx.fill();
 ctx.fillStyle='#bfe7ff';roundRect(-w/2+6,-h/2+9,w-12,20,4);ctx.fill();
 ctx.fillStyle='#111';ctx.fillRect(-w/2-4,-h/2+15,4,15);ctx.fillRect(w/2,-h/2+15,4,15);
 ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function spawnCar(){
 const lanes=[95,145,215,265],x=lanes[Math.floor(Math.random()*lanes.length)];
 cars.push({x,y:-70,w:46,h:76,color:['#e33','#3498db','#f39c12','#9b59b6'][Math.floor(Math.random()*4)]});
}
function hit(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2-5 && Math.abs(a.y-b.y)<(a.h+b.h)/2-8}
function loop(t){
 if(!running)return; let dt=Math.min((t-last)/16.67,2);last=t;
 score+=dt; level=1+Math.floor(score/800);
 let speed=(3.3+level*.35)*dt;
 if(keys.ArrowLeft)bus.x-=4.5*dt;
 if(keys.ArrowRight)bus.x+=4.5*dt;
 bus.x=Math.max(82,Math.min(278,bus.x));
 spawn+=dt;if(spawn>65-level*2){spawn=0;spawnCar()}
 cars.forEach(c=>c.y+=speed);
 for(let i=cars.length-1;i>=0;i--){
   let c=cars[i];
   if(hit(bus,c)){cars.splice(i,1);lives--;updateHud();if(lives<=0){running=false;setTimeout(gameOver,200);return}}
   else if(c.y>H+80){cars.splice(i,1);coins++;updateHud()}
 }
 draw();requestAnimationFrame(loop);
}
function gameOver(){
 document.getElementById('start').style.display='flex';
 document.querySelector('.panel').innerHTML='<h1>Game Over 🚌</h1><p>Coins: '+coins+'<br>Level: '+level+'</p><button class="startbtn" onclick="reset()">PLAY AGAIN</button>';
}
function press(k){keys[k]=true}
function release(k){keys[k]=false}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key))press(e.key)});
document.addEventListener('keyup',e=>release(e.key));
['left','right'].forEach(id=>{
 let k=id==='left'?'ArrowLeft':'ArrowRight',b=document.getElementById(id);
 b.addEventListener('pointerdown',()=>press(k));b.addEventListener('pointerup',()=>release(k));b.addEventListener('pointerleave',()=>release(k));
});
document.getElementById('brake').addEventListener('pointerdown',()=>{bus.speed=0});
document.getElementById('brake').addEventListener('pointerup',()=>{bus.speed=4});
document.getElementById('startBtn').onclick=reset;
draw();
</script>
</body>
</html>
